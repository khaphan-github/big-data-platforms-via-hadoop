<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Keywords Charts</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    p.desc {
      margin-top: 0;
      margin-bottom: 20px;
      color: #4b5563;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    button {
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: #0ea5e9;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button:hover {
      background: #0284c7;
    }

    img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
    }

    .status {
      font-size: 14px;
      color: #374151;
      margin-bottom: 10px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trending Keywords Analytics</h1>
    <p class="desc">Bam nut de tao chart tu API va xem ngay tai trang nay.</p>

    <div class="grid">
      <div class="card">
        <h2>Pie chart theo chu de</h2>
        <button onclick="loadChart('/api/charts/pie', 'img-pie', 'status-pie')">Tao Pie Chart</button>
        <div id="status-pie" class="status"></div>
        <img id="img-pie" alt="Pie chart theo chu de" src="" />
      </div>

      <div class="card">
        <h2>Top 20 tu khoa</h2>
        <button onclick="loadChart('/api/charts/top20', 'img-top20', 'status-top20')">Tao Top 20 Chart</button>
        <div id="status-top20" class="status"></div>
        <img id="img-top20" alt="Top 20 tu khoa" src="" />
      </div>

      <div class="card">
        <h2>Top 10 moi chu de</h2>
        <button onclick="loadChart('/api/charts/top10', 'img-top10', 'status-top10')">Tao Top 10 Chart</button>
        <div id="status-top10" class="status"></div>
        <img id="img-top10" alt="Top 10 moi chu de" src="" />
      </div>
    </div>
  </div>

  <script>
    async function loadChart(apiUrl, imgId, statusId) {
      const statusEl = document.getElementById(statusId);
      const imgEl = document.getElementById(imgId);

      statusEl.textContent = 'Dang tao chart...';

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();
        const chartUrl = data.url + '?t=' + Date.now();
        imgEl.src = chartUrl;
        statusEl.textContent = data.message;
      } catch (error) {
        statusEl.textContent = 'Loi: ' + error.message;
      }
    }
  </script>
</body>
</html>
